name: Test Go
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install Dependencies
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      # Runs once the repo is enabled on Codecov and a CODECOV_TOKEN secret is
      # added; skipped (keeping the build green) until then.
      - name: Upload coverage reports to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: invopop/gobl.de.xinvoice

  # A document is correct for a German format only if the KoSIT and FeRD
  # schematron says so, so the converted fixtures are validated against
  # the real rule sets. The phorm tag is pinned because it decides which
  # rule-set versions ship; if a bump drops a VESID the formats name, the
  # test says so instead of skipping.
  schematron:
    name: Schematron
    runs-on: ubuntu-latest

    services:
      phorm:
        image: phelger/phorm:2.2.6
        env:
          # Failed validations answer 200 with the findings in the body,
          # the contract the invopop/phorm client expects.
          CATALINA_OPTS: -Dphorm.api.response.onfailure.http400=false
        ports:
          - 8080:8080

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install Dependencies
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      - name: Validate the converted fixtures
        run: go test -run TestSchematron . -args -validate
